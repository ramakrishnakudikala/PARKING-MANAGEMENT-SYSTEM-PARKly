<!-- register2.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle & Mall Selection - PARKly</title>
  <!-- Google Fonts - Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/utils.js"></script>
  <style>
    .logo-container {
      text-align: center;
      padding: 30px 0;
      background: linear-gradient(to right, #000d6b, #0037a0);
      margin-bottom: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .logo {
      display: inline-block;
    }
    
    .logo h1 {
      font-size: 3rem;
      color: white;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    .logo p {
      color: #dcdcdc;
      margin-top: 5px;
      font-size: 1.2rem;
    }
    
    .step-indicator {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .step {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #ddd;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 10px;
      font-weight: bold;
    }
    
    .step.active {
      background-color: orange;
      color: white;
    }
    
    .step-line {
      height: 3px;
      background-color: #ddd;
      width: 50px;
      margin-top: 15px;
    }
    
    .user-info {
      background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
      border: 2px solid #2196f3;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(33, 150, 243, 0.2);
    }
    
    .user-info p {
      margin: 8px 0;
      font-size: 16px;
      color: #1565c0;
    }
    
    .user-info strong {
      color: #0d47a1;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Logo container -->
  <div style="text-align: center; padding: 30px 0; background: linear-gradient(to right, #000d6b, #0037a0); margin-bottom: 30px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
    <div style="display: inline-block;">
      <h1 style="font-size: 3rem; color: white; margin: 0; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);">PARKly</h1>
      <p style="color: #dcdcdc; margin-top: 5px; font-size: 1.2rem;">Parking made efficiently</p>
    </div>
  </div>
  
  <div class="container">
    
    <div class="form-container">
      <h2 style="text-align: center; margin-bottom: 20px; color: #333; font-size: 2rem; font-weight: bold;">Select Vehicle & Mall</h2>
      
      <div id="userInfoSection" class="user-info">
        <p><strong>Registered Name:</strong> <span id="userName"></span></p>
        <p><strong>Phone Number:</strong> <span id="userPhone"></span></p>
      </div>
      
      <form id="step2Form" onsubmit="event.preventDefault(); completeRegistration();">
        <label for="vehicleInput">Enter Vehicle Number</label>
        <input type="text" id="vehicleInput" placeholder="Enter your registered vehicle number (AA00AA0000)" required aria-required="true" oninput="onVehicleInput()" style="text-transform: uppercase;">
        <div id="vehicleError" class="error-message"></div>
        
        <!-- Auto-filled vehicle details -->
        <div id="vehicleDetails" style="display: none; background-color: #e8f5e8; padding: 15px; border-radius: 8px; margin: 15px 0; border: 2px solid #4CAF50;">
          <h4 style="margin: 0 0 10px 0; color: #2e7d32;">✓ Vehicle Found</h4>
          <p><strong>Vehicle Number:</strong> <span id="selectedVehicleNumber"></span></p>
          <p><strong>Vehicle Type:</strong> <span id="selectedVehicleType"></span></p>
          <p><strong>Electric Vehicle:</strong> <span id="selectedEVStatus"></span></p>
          <p><strong>Owner:</strong> <span id="selectedOwnerName"></span></p>
        </div>
        
        <!-- Vehicle not found message -->
        <div id="vehicleNotFound" style="display: none; background-color: #ffebee; padding: 15px; border-radius: 8px; margin: 15px 0; border: 2px solid #f44336;">
          <h4 style="margin: 0 0 10px 0; color: #c62828;">✗ Vehicle Not Registered</h4>
          <p style="margin: 0; color: #d32f2f;">This vehicle number is not registered in our system. Please register first or check your vehicle number.</p>
          <button type="button" onclick="goToRegistration()" style="margin-top: 10px; padding: 8px 16px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">Register Vehicle</button>
        </div>

        <label for="mallSelect">Select Mall</label>
        <select id="mallSelect" required aria-required="true">
          <option value="">Select Mall</option>
          <option value="Mall A">Next Galleria Mall</option>
          <option value="Mall B">Inrobit Mall</option>
          <option value="Mall C">GVK Mall</option>
        </select>
        <div id="mallError" class="error-message"></div>

        <div class="button-group">
          <button type="submit">Choose Slot</button>
        </div>
        
        <div style="margin-top: 10px;">
          <button type="button" class="secondary" onclick="goBackToHome()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function showError(elementId, message) {
      const errorElement = document.getElementById(elementId);
      errorElement.textContent = message;
      errorElement.style.display = "block";
      return false;
    }

    function clearErrors() {
      const errorElements = document.querySelectorAll('.error-message');
      errorElements.forEach(element => {
        element.textContent = "";
        element.style.display = "none";
      });
    }
    


    let selectedVehicle = null;
    let vehicleValidationTimeout = null;

    function onVehicleInput() {
      const vehicleInput = document.getElementById("vehicleInput");
      const vehicleNumber = vehicleInput.value.trim().toUpperCase();
      
      // Clear previous timeout
      if (vehicleValidationTimeout) {
        clearTimeout(vehicleValidationTimeout);
      }
      
      // Hide all status divs initially
      document.getElementById("vehicleDetails").style.display = "none";
      document.getElementById("vehicleNotFound").style.display = "none";
      clearErrors();
      selectedVehicle = null;
      
      // If input is empty, don't validate
      if (!vehicleNumber) {
        return;
      }
      
      // Validate vehicle number format first
      if (!validateVehicleNumber(vehicleNumber)) {
        if (vehicleNumber.length >= 4) { // Only show error if user has typed enough
          showError("vehicleError", "Invalid vehicle number format. Use AA00AA0000");
        }
        return;
      }
      
      // Set timeout to validate after user stops typing
      vehicleValidationTimeout = setTimeout(() => {
        validateAndFetchVehicleData(vehicleNumber);
      }, 500);
    }
    
    function validateAndFetchVehicleData(vehicleNumber) {
      // Get vehicle details from registered vehicles
      const registeredVehicles = getRegisteredVehicles();
      const foundVehicle = registeredVehicles.find(v => v.vehicleNo === vehicleNumber);
      
      if (foundVehicle) {
        // Vehicle found - show details
        selectedVehicle = foundVehicle;
        showVehicleDetails(foundVehicle);
      } else {
        // Vehicle not found
        showVehicleNotFound();
      }
    }
    
    function showVehicleDetails(vehicle) {
      const vehicleDetails = document.getElementById("vehicleDetails");
      const selectedVehicleNumber = document.getElementById("selectedVehicleNumber");
      const selectedVehicleType = document.getElementById("selectedVehicleType");
      const selectedEVStatus = document.getElementById("selectedEVStatus");
      const selectedOwnerName = document.getElementById("selectedOwnerName");
      
      // Use the actual owner name from vehicle registration data
      const ownerName = vehicle.ownerName || "Unknown Owner";
      
      selectedVehicleNumber.textContent = vehicle.vehicleNo;
      selectedVehicleType.textContent = vehicle.vehicleType;
      selectedEVStatus.textContent = vehicle.isEV ? "Yes ⚡" : "No";
      selectedOwnerName.textContent = ownerName;
      
      vehicleDetails.style.display = "block";
      document.getElementById("vehicleNotFound").style.display = "none";
    }
    
    function showVehicleNotFound() {
      document.getElementById("vehicleDetails").style.display = "none";
      document.getElementById("vehicleNotFound").style.display = "block";
      selectedVehicle = null;
    }
    
    function goToRegistration() {
      // Clear session data and go to registration
      sessionStorage.removeItem("isExistingUser");
      window.location.href = "register.html";
    }

    function completeRegistration() {
      clearErrors();
      
      const vehicleNumber = document.getElementById("vehicleInput").value.trim().toUpperCase();
      const mall = document.getElementById("mallSelect").value;
      
      let isValid = true;
      
      // Validate vehicle number input
      if (!vehicleNumber) {
        isValid = showError("vehicleError", "Please enter your vehicle number");
      } else if (!validateVehicleNumber(vehicleNumber)) {
        isValid = showError("vehicleError", "Invalid vehicle number format. Use AA00AA0000");
      } else if (!selectedVehicle) {
        isValid = showError("vehicleError", "Vehicle not found. Please check your vehicle number or register first");
      }
      
      // Validate mall selection
      if (!mall) {
        isValid = showError("mallError", "Please select a mall");
      }
      
      if (!isValid) {
        return;
      }

      // Create user object with selected vehicle details and mall
      const user = { 
        vehicleNo: selectedVehicle.vehicleNo,
        vehicleType: selectedVehicle.vehicleType,
        isEV: selectedVehicle.isEV,
        mall: mall
      };
      saveCurrentUser(user);
      
      showToast("Vehicle selection completed successfully!");
      setTimeout(() => {
        window.location.href = "booking.html";
      }, 1500);
    }
    
    function goBackToHome() {
      // Clear session data and go back to home
      sessionStorage.removeItem("step1Data");
      sessionStorage.removeItem("isExistingUser");
      window.location.href = 'index.html';
    }
    
    function migrateVehicleData() {
      // Migration function to add owner names to existing vehicles
      const registeredVehicles = getRegisteredVehicles();
      let needsUpdate = false;
      
      registeredVehicles.forEach(vehicle => {
        if (!vehicle.ownerName) {
          // For existing vehicles without owner name, set a default
          vehicle.ownerName = "Registered User";
          needsUpdate = true;
        }
      });
      
      if (needsUpdate) {
        saveRegisteredVehicles(registeredVehicles);
        console.log("Migrated vehicle data to include owner names");
      }
    }
    
    // Initialize page
    window.addEventListener('load', function() {
      // Migrate existing vehicles to include owner name if missing
      migrateVehicleData();
      
      const step1Data = JSON.parse(sessionStorage.getItem("step1Data"));
      const isExistingUser = sessionStorage.getItem("isExistingUser") === "true";
      
      if (isExistingUser) {
        // Existing user login flow - hide user info section (they're already registered)
        document.getElementById("userInfoSection").style.display = "none";
        
        // Check if they have registered vehicles for sign-in
        const registeredVehicles = getRegisteredVehicles();
        if (!registeredVehicles || registeredVehicles.length === 0) {
          showToast("No registered vehicles found. Please register first.", true);
          setTimeout(() => {
            window.location.href = "register.html";
          }, 2000);
          return;
        }
        
        // Focus on vehicle input for existing users
        document.getElementById("vehicleInput").focus();
      } else {
        // New user registration flow - require registration data from step 1
        if (!step1Data) {
          // If no registration data, redirect back to login/registration page
          showToast("Please complete registration first", true);
          setTimeout(() => {
            window.location.href = "register.html";
          }, 2000);
          return;
        }
        
        // Display user info from registration step
        document.getElementById("userName").textContent = step1Data.name || "Not provided";
        document.getElementById("userPhone").textContent = step1Data.phoneNo || "Not provided";
        
        // Show user info section for new registrations
        document.getElementById("userInfoSection").style.display = "block";
        
        // For new users, we can pre-fill the vehicle if they just registered one
        if (step1Data.vehicles && step1Data.vehicles.length > 0) {
          // If user just registered and has only one vehicle, pre-fill it
          if (step1Data.vehicles.length === 1) {
            document.getElementById("vehicleInput").value = step1Data.vehicles[0].vehicleNo;
            validateAndFetchVehicleData(step1Data.vehicles[0].vehicleNo);
          }
        }
      }
    });
  </script>
</body>
</html>
